name: E2E Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  e2e-ios:
    name: Detox iOS E2E
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app (Detox)
        run: bun run e2e:build:ios

      - name: Run Detox tests
        run: EXPO_PUBLIC_E2E=true bun run e2e:test:ios -- --cleanup

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: |
            artifacts/
            e2e/artifacts/
          if-no-files-found: ignore
