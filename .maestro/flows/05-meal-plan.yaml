appId: app.cookkit.cookkit
name: "Meal Plan Navigation"
tags:
  - P1
  - meal-plan
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- tapOn:
    id: "home-profile-button"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 5000
- tapOn:
    id: "profile-meal-plan-button"
- extendedWaitUntil:
    visible:
      id: "meal-plan-screen"
    timeout: 5000
